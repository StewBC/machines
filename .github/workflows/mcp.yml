name: Emulator MCP adapter
on:
  push:
    paths: ['mcp/**', 'src/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', 'src/**', '.github/workflows/mcp.yml']
jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r mcp/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./mcp
      - run: python mcp/tools/check_protocol_manifest.py
      - run: python -m pytest mcp/tests
