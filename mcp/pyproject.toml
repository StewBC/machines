[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machines-emulator-mcp"
version = "0.1.0"
description = "Local typed MCP access to A2M/16 and C64M/10 emulators"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
machines-mcp = "machines_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
